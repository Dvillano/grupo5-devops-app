# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Backend CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'api/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'api/**'
      - '.github/workflows/backend-ci-cd.yml'

jobs:
  build:
    name: Build, Lint & Deploy API
    runs-on: ubuntu-latest

    steps:
      # Clone repo
    - name: Checkout repository
      uses: actions/checkout@v4

      # Configure Node V22
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # Install backend dependencies
    - name: Install dependencies
      working-directory: api
      run: npm ci

    # Run Linter
    - name: Run linter
      working-directory: api
      run: npm run lint

    # Run Tests
    - name: Run tests
      working-directory: api
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: npm test

    # Set image tag (use Git tag if present, otherwise short SHA)
    - name: Set image tag
      id: set_tag
      run: |
        echo "Determining image tag..."
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          TAG="${GITHUB_REF#refs/tags/}"
        else
          TAG="sha-${GITHUB_SHA:0:8}"
        fi
        echo "TAG=$TAG" >> $GITHUB_ENV
        echo "Image tag set to $TAG"

    # Login Docker Hub
    - name: Docker Login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USER }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Build and Push Backend Docker Image
    - name: Build and Push Backend Docker Image
      env:
        DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
        TAG: ${{ env.TAG }}
      run: |
        echo "Building and pushing backend image: $DOCKERHUB_USER/grupo5-api:$TAG"
        docker build -t $DOCKERHUB_USER/grupo5-api:$TAG ./api --build-arg APP_VERSION=$TAG
        docker push $DOCKERHUB_USER/grupo5-api:$TAG

    # ...frontend build removed from this workflow (moved to .github/workflows/frontend-ci-cd.yml)

    # Deploy to Render
    - name: Trigger Render Deploy
      env:
        DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
        TAG: ${{ env.TAG }}
        RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
      run: |
        echo "Notifying Render deploy webhook (sending image tag)..."
        curl -X POST -H 'Content-Type: application/json' -d '{"backend": "'"${DOCKERHUB_USER}/grupo5-api:${TAG}"'"}' "$RENDER_HOOK"
