name: Backend CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'api/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'api/**'
      - '.github/workflows/backend-ci-cd.yml'

jobs:
  # CI 
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Clone repo
    - name: Checkout repository
      uses: actions/checkout@v4

      # Configure Node V22 with Cache
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: api/package-lock.json

    # Install backend dependencies
    - name: Install dependencies
      working-directory: api
      run: npm ci

    # Run Linter
    - name: Run linter
      working-directory: api
      run: npm run lint

    # Run Tests
    - name: Run tests
      working-directory: api
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: npm test

  # CD 
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: test # Only execute if test was successful 

    # Only execute if push to main branch (PR Approved)
    if: github.ref == 'refs/heads/main'  
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Docker Login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USER }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKERHUB_USER }}/grupo5-api
        tags: |
          type=sha,format=long
          type=raw,value=latest

    - name: Build and push Docker image
      id: build-and-push 
      uses: docker/build-push-action@v5
      with:
        context: ./api
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Trigger Render Deploy
      run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_API }}
