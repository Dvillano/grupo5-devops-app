name: Frontend CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci-cd.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci-cd.yml'

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Clone repo
    - name: Checkout repository
      uses: actions/checkout@v4

      # Configure Node V22 with Cache
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    # Install frontend dependencies
    - name: Install dependencies
      working-directory: frontend
      run: npm ci

    # Run Linter
    - name: Run linter
      working-directory: frontend
      run: npm run lint

    # Run Tests
    - name: Run tests
      working-directory: frontend
      run: npm test -- --watchAll=false

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Docker Login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USER_CAMILA }}
        password: ${{ secrets.DOCKERHUB_TOKEN_CAMILA }}

    - name: Build and Push Frontend Docker Image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USER_CAMILA }}/grupo5-frontend:latest ./frontend
        docker push ${{ secrets.DOCKERHUB_USER_CAMILA }}/grupo5-frontend:latest

    - name: Trigger Render Deploy
      run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}